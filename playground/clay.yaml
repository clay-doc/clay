# Sample site used for development (npm run dev) and tests
title: "Clay"
favicon: "logo.svg"
baseURL: "/"
siteURL: "https://clay-doc.github.io"
editURL: "https://github.com/clay-doc/clay/edit/main/playground/docs/"
version: "2.x"
languages: ["en", "de"]
navbar:
  logo: "logo.svg"
  source:
    name: "Github"
    icon: "fa-brands fa-github"
    link: "https://github.com/clay-doc/clay"
  links:
    - name: "Example"
      icon: "fa-solid fa-book"
      link: "https://clay-doc.github.io/clay-example-repo"
# {{version}} in the docs, and extra tags in the head of every page
variables:
  version: "4.0"
# The page menu without ChatGPT
pageActions:
  chatgpt: false
head:
  meta:
    - name: "clay-playground"
      content: "from clay.yaml"
