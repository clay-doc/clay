name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write       # tags, releases, CHANGELOG
  pull-requests: write  # the release pull request
  id-token: write       # npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # Keeps a release pull request with the next version and changelog,
      # derived from Conventional Commits; merging it creates the release
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Checkout Repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Unit Tests
        if: ${{ steps.release.outputs.release_created }}
        run: npm test

      # Signed provenance links the package to this workflow run. Uses npm
      # trusted publishing when configured for the package, NPM_TOKEN otherwise.
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
