version: 2
updates:
  # Keeps the SHA-pinned actions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # The type check needs vue-tsc, which does not support TypeScript 7 yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Newer Node.js types would allow APIs that the oldest supported Node.js lacks
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Breaks Nitro's prerendering ("Invalid key"); unstorage is pinned to 1.17.5
      - dependency-name: unstorage
        versions: ["1.17.6"]
