name: Release

on:
  push:
    branches:
      - main
  # Publishes the current version to npm, e.g. after a failed publish
  workflow_dispatch:

permissions:
  contents: write       # tags, releases, CHANGELOG
  pull-requests: write  # the release pull request
  id-token: write       # npm provenance

# One release at a time, in the order of the pushes
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    # Nothing is released or published unless the tests pass
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Keeps a release pull request with the next version and changelog,
      # derived from Conventional Commits; merging it creates the release
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Checkout Repository
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check Published Version
        id: published
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "clay-doc@$version" version > /dev/null 2>&1; then
            echo "clay-doc@$version is already on npm"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        if: ${{ (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') && !steps.published.outputs.exists }}
        run: npm ci

      # npm trusted publishing: npm authenticates with this workflow's OIDC
      # token, so no token secret is needed; signed provenance links the
      # package to the run. The version is only staged: it goes live once a
      # maintainer approves it on npmjs.com with 2FA.
      - name: Stage on npm
        if: ${{ (steps.release.outputs.release_created || github.event_name == 'workflow_dispatch') && !steps.published.outputs.exists }}
        run: npm stage publish . --provenance --access public
